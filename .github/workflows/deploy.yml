name: Deploy VPS Make It Easy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: easingthemes/ssh-deploy@main
        env:
          # Configura estas variables en:
          # GitHub Repo → Settings → Secrets and variables → Actions → Repository secrets
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          REMOTE_PORT: ${{ secrets.VPS_PORT || '22' }}

          # Rsync — transferencia rápida, elimina archivos viejos
          ARGS: "-rlgoDzvc -i --delete"

          # Copia toda la carpeta al servidor
          SOURCE: "/"

          # Ruta en el VPS (ajusta según tu configuración de Nginx)
          TARGET: "/var/www/html/makeiteasy"

          # Archivos que NO se envían al VPS
          EXCLUDE: "/.git/, /.github/, /.agents/, /.claude/, /.neovate/, /.windsurf/, /stitch/, /skills/, /skills-lock.json, /SRS_MakeItEasy_Website.md, /.gitignore, /README.md"

          # Ejecutar comandos en el VPS después de transferir los archivos
          SCRIPT_AFTER: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /var/www/html/makeiteasy/make-it-easy-crm
            npm install
            npm run build
            pm2 delete mie-crm || true
            fuser -k 3002/tcp || true
            fuser -k 3001/tcp || true
            kill -9 $(lsof -t -i:3002) || true
            kill -9 $(lsof -t -i:3001) || true
            pm2 start ecosystem.config.js --env production
            pm2 logs mie-crm --lines 200 --no-colors > public/pm2-logs.txt


