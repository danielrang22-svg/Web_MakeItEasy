name: Deploy VPS Make It Easy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify VPS to deploy via webhook
        run: |
          echo "🚀 Notificando al VPS para que haga auto-deploy..."

          BODY='{"ref":"main","event":"push"}'
          SIGNATURE=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" | sed 's/.*= //' | awk '{print "sha256="$1}')

          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-deploy-signature: $SIGNATURE" \
            -d "$BODY" \
            "${{ secrets.VPS_APP_URL }}/api/deploy" \
            --max-time 30)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/deploy_response.txt

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Deploy iniciado exitosamente en el VPS"
          else
            echo "❌ Error al notificar al VPS (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Wait for deploy to complete
        run: |
          echo "⏳ Esperando 90 segundos para que el VPS termine el build..."
          sleep 90

      - name: Verify deployment
        run: |
          echo "🔍 Verificando que el CRM responde..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VPS_APP_URL }}/login" \
            --max-time 30)

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ CRM respondiendo correctamente en producción"
          else
            echo "⚠️ CRM retornó HTTP $HTTP_STATUS — puede estar iniciando aún"
          fi
