name: Deploy VPS Make It Easy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: easingthemes/ssh-deploy@main
        env:
          # Estas variables de entorno debes configurarlas en:
          # GitHub Repo -> Settings -> Secrets and variables -> Actions -> Repository secrets
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          
          # Argumentos de Rsync para transferir rápido y eliminar lo viejo
          ARGS: "-rlgoDzvc -i --delete"
          
          # Copia toda la carpeta actual hacia el servidor
          SOURCE: "/"
          
          # RUTA FINAL EN TU VPS (MODIFICAR SEGÚN TU NGINX)
          TARGET: "/var/www/html/makeiteasy"
          
          # Archivos que GitHub no debe enviar al VPS
          EXCLUDE: "/.git/, /.github/, /.agents/, /.gitignore, /README.md"
