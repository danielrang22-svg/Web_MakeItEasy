name: Deploy VPS Make It Easy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ] && MISSING="$MISSING DEPLOY_WEBHOOK_SECRET"
          [ -z "${{ secrets.VPS_APP_URL }}" ]           && MISSING="$MISSING VPS_APP_URL"
          if [ -n "$MISSING" ]; then
            echo "❌ Faltan secretos en GitHub:$MISSING"
            echo "   Ve a: Repo → Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          echo "✅ Secretos OK"

      # ── Paso 1: copiar archivos al VPS por rsync ──────────────────────────
      - name: Copy files to VPS via rsync
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST:     ${{ secrets.VPS_HOST }}
          REMOTE_USER:     ${{ secrets.VPS_USER }}
          REMOTE_PORT:     ${{ secrets.VPS_PORT || '22' }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: "/"
          TARGET: "/var/www/html/makeiteasy"
          EXCLUDE: >-
            /.git/, /.github/, /.agents/, /.claude/, /.neovate/, /.windsurf/,
            /stitch/, /skills/, /skills-lock.json, /SRS_MakeItEasy_Website.md,
            /.gitignore, /README.md,
            **/.env, **/.env.production, /make-it-easy-crm/.env,
            **/node_modules/, **/.next/

      # ── Paso 2: notificar al VPS para que haga build + restart ────────────
      - name: Trigger build & restart via webhook
        run: |
          echo "🔔 Notificando al VPS para build + restart..."

          DEPLOY_URL="${{ secrets.VPS_APP_URL }}/api/deploy"
          BODY='{"ref":"main","event":"push"}'
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print "sha256="$2}')

          echo "📡 POST $DEPLOY_URL"

          HTTP_STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-deploy-signature: $SIGNATURE" \
            -d "$BODY" \
            "$DEPLOY_URL" \
            --max-time 120 --connect-timeout 20)

          echo "HTTP $HTTP_STATUS  →  $(cat /tmp/resp.txt)"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Deploy iniciado en el VPS"
          else
            echo "❌ Webhook retornó HTTP $HTTP_STATUS"
            exit 1
          fi

      # ── Paso 3: esperar y verificar ───────────────────────────────────────
      - name: Wait for build to complete
        run: |
          echo "⏳ Esperando 100s que el VPS compile..."
          sleep 100

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VPS_APP_URL }}/login" --max-time 20)
          echo "CRM /login → HTTP $STATUS"
          [ "$STATUS" -eq 200 ] && echo "✅ CRM en producción OK" || echo "⚠️ HTTP $STATUS (puede estar iniciando)"
