<!DOCTYPE html>
<html lang="es-CO" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Make it Easy</title>
  <meta name="description" content="La página que buscas no existe o cambió de dirección. Vuelve al inicio o explora nuestras soluciones de automatización con IA." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/globals.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    .nf-card {
      max-width: 640px; text-align: center; padding: 3.5rem 2rem;
      border-radius: var(--radius-lg);
      background: radial-gradient(ellipse at 50% 0%, rgba(143,245,255,.10), transparent 60%), var(--surface-container);
      border: 1px solid var(--outline-variant);
      box-shadow: var(--shadow-lg);
    }
    .nf-code {
      font-size: clamp(4rem, 16vw, 7rem); font-weight: 800; line-height: 1;
      letter-spacing: -0.04em; margin: 0 0 .5rem;
      background: linear-gradient(135deg, #8ff5ff 0%, #af88ff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .nf h1 { font-size: 1.6rem; margin: 0 0 .75rem; color: var(--on-surface); }
    .nf p { color: var(--on-surface-variant); margin: 0 auto 2rem; max-width: 42ch; line-height: 1.7; }
    .nf-actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    .nf-link {
      display: inline-block; padding: .8rem 1.4rem; border-radius: var(--radius-full);
      text-decoration: none; font-weight: 700; font-size: .9rem;
    }
    .nf-link-primary { background: var(--gradient-primary); color: var(--on-primary); }
    .nf-link-ghost { border: 1px solid var(--outline); color: var(--on-surface); }
    .nf-links { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 1.25rem; justify-content: center; font-size: .85rem; }
    .nf-links a { color: var(--primary); text-decoration: none; }
    .nf-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-card">
      <p class="nf-code">404</p>
      <h1>Esta página se automatizó sola</h1>
      <p>El enlace que seguiste no existe o cambió de dirección. No pasa nada: todo lo importante está a un clic.</p>
      <div class="nf-actions">
        <a href="/" class="nf-link nf-link-primary">Volver al inicio</a>
        <a href="/herramientas" class="nf-link nf-link-ghost">Ver herramientas IA</a>
      </div>
      <div class="nf-links">
        <a href="/#servicios">Servicios</a>
        <a href="/#planes">Precios</a>
        <a href="/#faq">Preguntas frecuentes</a>
        <a href="/#contacto">Contacto</a>
      </div>
    </div>
  </main>
</body>
</html>
