# Make it Easy — CRM (crm.makeiteasycol.com)
# App Next.js en /var/www/apps/mie-crm (standalone) escuchando en 127.0.0.1:3011.
# Copiar a /etc/nginx/sites-available/mie-crm y recargar:
#   cp deploy/nginx-crm.conf /etc/nginx/sites-available/mie-crm
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name crm.makeiteasycol.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://crm.makeiteasycol.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.makeiteasycol.com;

    ssl_certificate     /etc/letsencrypt/live/crm.makeiteasycol.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crm.makeiteasycol.com/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Importación de Excel/Word en cotizaciones y tareas
    client_max_body_size 25m;

    # Compresión (el CRM sirve mucho JSON y JS)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets con hash: cache inmutable de 1 año
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }
}
