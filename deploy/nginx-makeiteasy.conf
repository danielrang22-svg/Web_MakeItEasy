# Make it Easy — makeiteasycol.com
# Dominio canónico: https://makeiteasycol.com (apex, HTTPS)
# www y HTTP redirigen 301 al canónico.
# Copiar a /etc/nginx/sites-available/makeiteasy y recargar:
#   cp deploy/nginx-makeiteasy.conf /etc/nginx/sites-available/makeiteasy
#   nginx -t && systemctl reload nginx

# ── HTTP → HTTPS ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name makeiteasycol.com www.makeiteasycol.com;

    # Reto ACME para renovaciones de certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://makeiteasycol.com$request_uri;
    }
}

# ── www → apex ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.makeiteasycol.com;

    ssl_certificate     /etc/letsencrypt/live/makeiteasycol.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/makeiteasycol.com/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://makeiteasycol.com$request_uri;
}

# ── Sitio canónico ────────────────────────────────────────────
server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name makeiteasycol.com;

    root  /var/www/html/makeiteasy;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/makeiteasycol.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/makeiteasycol.com/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Cabeceras de seguridad ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Compresión ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # ── Bloqueo de archivos internos y ruido de deploy ────────
    # Nunca exponer .git, .env, logs, documentación ni código fuente.
    location ~ /\.(?!well-known) {
        return 404;
    }
    location ^~ /make-it-easy-crm/ { return 404; }
    location ^~ /skills/           { return 404; }
    location ^~ /stitch/           { return 404; }
    location ^~ /scratch/          { return 404; }
    location ^~ /docs/             { return 404; }
    location ~* \.(md|log|zip|docx|bat|env|lock|bak|old|sql|prisma)$ { return 404; }
    location ~* /(README|SRS_|Propuesta|deploy|VPS) { return 404; }

    # ── URLs canónicas (sin .html, sin duplicados) ────────────
    location = /index.html        { return 301 https://makeiteasycol.com/; }
    location = /herramientas.html { return 301 https://makeiteasycol.com/herramientas; }
    location = /privacidad.html   { return 301 https://makeiteasycol.com/privacidad; }
    location = /terminos.html     { return 301 https://makeiteasycol.com/terminos; }

    # ── Cache ─────────────────────────────────────────────────
    location ~* \.(css|js|mjs)$ {
        expires 7d;
    }
    location ~* \.(svg|png|jpe?g|webp|avif|ico|woff2?|ttf|otf)$ {
        expires 30d;
    }
    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; }

    # ── Páginas ───────────────────────────────────────────────
    # HTML siempre revalida: tras cada deploy se ve la versión nueva.
    # "location = /" evita el 301 a sí mismo que produce $uri/ en la raíz.
    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
        expires -1;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    error_page 404 /404.html;
}
