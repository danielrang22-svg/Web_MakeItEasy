version: "3.9"

# PostgreSQL para desarrollo local (opcional)
# Uso: docker compose up -d
# Luego: DATABASE_URL="postgresql://vibrand:vibrand_dev@localhost:5432/vibrand_crm"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibrand_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibrand_crm
      POSTGRES_USER: vibrand
      POSTGRES_PASSWORD: vibrand_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
